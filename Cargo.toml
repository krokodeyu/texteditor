[package]
name = "texteditor"
version = "0.1.0"
edition = "2024"

[dependencies]
shell-words = "1.1"
roxmltree = "0.20"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
shlex = "1.3"
tempfile = "3"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }